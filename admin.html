<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>AIR Visitors - Team only</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <link rel="icon" href="./favicon.png" type="image/png">
  <link rel="stylesheet" href="./admin.css">
</head>
<body>
  <div id="root">
    <div id="ad-boot" style="max-width:360px;margin:24vh auto 0;text-align:center;color:#8a8a90;font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding:0 24px;line-height:1.5;">
      <p style="color:#d9962e;font-size:12px;letter-spacing:.3em;text-transform:uppercase;font-weight:700;">AIR Visitors</p>
      <p>Loading the dashboard&hellip;</p>
      <noscript><p>This page needs JavaScript. Turn it on (or turn off any content blocker for this site) and reload.</p></noscript>
    </div>
  </div>
  <script>
    (function () {
      function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
      window.__adShowError = function (msg) {
        var root = document.getElementById('root');
        if (!root || root.getAttribute('data-ad-rendered')) return;
        root.innerHTML = '<div style="max-width:420px;margin:20vh auto 0;text-align:center;color:#f2efe8;font-family:ui-sans-serif,system-ui,sans-serif;padding:0 24px;line-height:1.6;">'
          + '<p style="color:#d9962e;font-size:12px;letter-spacing:.3em;text-transform:uppercase;font-weight:700;">AIR Visitors</p>'
          + '<p>The dashboard could not start on this browser.</p>'
          + '<p style="color:#8a8a90;font-size:13px;">' + esc(msg) + '</p>'
          + '<p style="color:#8a8a90;font-size:13px;">Try a full reload, or open this link in Safari/Chrome directly. If you use a content blocker or have cookies fully blocked, allow this site and reload.</p></div>';
      };
      window.addEventListener('error', function (e) {
        if (!document.getElementById('root') || document.getElementById('root').getAttribute('data-ad-rendered')) return;
        window.__adShowError('Error: ' + (e.message || 'script failed to load'));
      }, true);
      setTimeout(function () {
        var root = document.getElementById('root');
        var boot = document.getElementById('ad-boot');
        if (root && boot && !root.getAttribute('data-ad-rendered')) {
          boot.innerHTML = '<p style="color:#d9962e;font-size:12px;letter-spacing:.3em;text-transform:uppercase;font-weight:700;">AIR Visitors</p>'
            + '<p>This page is not loading on this browser.</p>'
            + '<p style="font-size:13px;">Try opening the link in Safari or Chrome directly. If you use a content blocker or have cookies fully blocked, allow this site and reload.</p>';
        }
      }, 8000);
    })();
  </script>
  <script src="./admin.js" defer></script>
</body>
</html>
